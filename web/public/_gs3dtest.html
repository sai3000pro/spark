<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>gs3d probe</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1211; color: #eee; font: 12px monospace; }
      #stage { position: absolute; inset: 0; }
      #hud { position: absolute; z-index: 10; left: 8px; top: 8px; background: #000a; padding: 6px 8px; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud">booting…</div>
    <script type="module">
      const hud = document.getElementById("hud");
      const log = (s) => { hud.textContent = s; };

      const q = new URLSearchParams(location.search);
      const num = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
      const up = [num("ux", 0), num("uy", 1), num("uz", 0)];
      const pos = [num("px", 0), num("py", 1.1), num("pz", 10.5)];
      const look = [num("lx", -0.5), num("ly", -0.1), num("lz", -2)];
      const src = q.get("src") || "/mock/splats/summerhacks_build_room.ply";

      const GS = await import("https://esm.sh/@mkkellogg/gaussian-splats-3d@0.4.7?deps=three@0.160.1");

      const viewer = new GS.Viewer({
        rootElement: document.getElementById("stage"),
        selfDrivenMode: true,
        useBuiltInControls: true,
        sharedMemoryForWorkers: false,
        gpuAcceleratedSort: false,
        dynamicScene: false,
        showLoadingUI: false,
        cameraUp: up,
        initialCameraPosition: pos,
        initialCameraLookAt: look,
      });
      window.viewer = viewer;
      viewer.start();

      // First frame that actually draws something — the number that matters.
      const t0 = performance.now();
      let tFirstDraw = null;
      const watch = setInterval(() => {
        if (tFirstDraw === null && viewer.splatMesh?.geometry?.instanceCount > 0) {
          tFirstDraw = performance.now() - t0;
        }
      }, 50);

      let pct = 0;
      log(`${src}\nloading…`);
      await viewer.addSplatScene(src, {
        progressiveLoad: true,
        splatAlphaRemovalThreshold: 5,
        showLoadingUI: false,
        onProgress: (p) => { pct = p; log(`${src}\ndownload ${Math.round(p)}%  ·  ${((performance.now()-t0)/1000).toFixed(1)}s`); },
      });
      const tReady = performance.now() - t0;
      clearInterval(watch);

      log(
        `${src}\n` +
          `splats      ${viewer.splatMesh.getSplatCount().toLocaleString()}\n` +
          `rendering   ${viewer.splatMesh.geometry.instanceCount.toLocaleString()}\n` +
          `first draw  ${tFirstDraw === null ? "—" : (tFirstDraw / 1000).toFixed(1) + "s"}\n` +
          `fully ready ${(tReady / 1000).toFixed(1)}s`,
      );
    </script>
  </body>
</html>
